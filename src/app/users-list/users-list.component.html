<div class="wrapper">
    <app-create-user-form (createUser)="createUser($event)"></app-create-user-form>

    <div class="users__container">
        <div *ngFor="let user of usersService.users$ | async">
            <app-user-card [user]='user' (deleteUser)='deleteUser(user.id)'></app-user-card>
        </div>
    </div>
</div>
